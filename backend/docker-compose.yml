version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NAME: chat_app
      AUTH_SECRET: local-dev-secret
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '27017:27017'

  redis:
    image: redis:7
    ports:
      - '6379:6379'
